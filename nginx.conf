server {
    listen 8080;
    server_name _;

    # Chạy trên origin riêng (buddha.amllc.cloud) nên serve ngay tại root:
    # không strip prefix, không lệ thuộc path mà reverse proxy chuyển xuống.
    root /usr/share/nginx/html;
    index index.html;

    # Sau cloudflared, request tới đây là HTTP thuần. absolute_redirect off khiến
    # nginx phát Location tương đối thay vì "http://host/..." — tránh đẩy client
    # về HTTP và tạo redirect loop qua Cloudflare.
    absolute_redirect off;
    port_in_redirect off;

    # getUserMedia chỉ chạy trong secure context; ngoài ra Permissions-Policy
    # phải cho phép camera, nếu không Chrome chặn trước khi hỏi quyền.
    add_header Permissions-Policy "camera=(self), microphone=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Dùng expires thay cho add_header Cache-Control: add_header trong location
    # sẽ xoá toàn bộ add_header kế thừa từ server block.
    location ~* \.html$ {
        expires -1;
    }

    location ~* \.(css|js)$ {
        expires 1h;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
